[package]
name = "tape-decode"
version = "0.1.0"
edition = "2021"

[features]
default = ["native-fft"]
native-fft = [
    "realfft/avx",
    "realfft/neon",
    "realfft/sse",
    "rustfft/avx",
    "rustfft/neon",
    "rustfft/sse",
]
deterministic = []

[dependencies]
anyhow = "1"
blake3 = "1"
libm = { version = "0.2", default-features = false, features = ["force-soft-floats"] }
num-traits = "0.2"
realfft = { version = "3", default-features = false }
rustfft = { version = "6", default-features = false }
sci-rs = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
